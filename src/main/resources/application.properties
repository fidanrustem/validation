spring.application.name=validation

spring.datasource.url=jdbc:h2:mem:validationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8081
# Logging configuration

# Show log levels and messages
logging.level.root=INFO

# Show logs from our application
logging.level.com.example.validation=DEBUG

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Save logs to a file
logging.file.name=logs/validation.log

# Maximum log file size
logging.logback.rollingpolicy.max-file-size=10MB

# Keep old log files
logging.logback.rollingpolicy.max-history=7