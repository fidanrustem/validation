
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Book Haven</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">Book Haven<span>.</span></div>

    <nav>
        <a href="/">Home</a>
        <a href="/library" class="active">My Books</a>
        <a href="/add-book">Add Book</a>
    </nav>
</header>

<main class="form-container">

    <div class="form-heading">
        <p class="subtitle">UPDATE YOUR COLLECTION</p>
        <h1>Edit Book</h1>
        <p class="description">Change your book information.</p>
    </div>

    <form th:action="@{/edit-book}" th:object="${book}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Book Title</label>
            <input type="text" th:field="*{title}" required>
        </div>

        <div class="form-group">
            <label>Author</label>
            <input type="text" th:field="*{author}" required>
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" th:field="*{price}"
                   min="1" step="0.01" required>
        </div>

        <button type="submit" class="submit-btn">Save Changes</button>

        <a href="/library" class="cancel-link">Cancel</a>

    </form>

</main>

</body>
</html>
